<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog</title>

    <style>
        header {
            background-color: #803402;
            color: white;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid #000000;
        }

        main {
            background-color: #ffffff;
            color: #8b2e03;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Blog Tech</h1>

        <p>
            Olá, meu nome é Maria Fernanda, e vou compartilhar
            conhecimentos sobre tecnologia e programação.
        </p>
    </header>

    <main>

        <img
            src="https://i.pinimg.com/736x/2f/0c/3b/2f0c3bace817d82210151652fe141b6f.jpg"
            alt="Imagem do Dean Winchester"
        >

        <div>
            <h2>Meu primeiro post</h2>

            <p class="artigo-autor">
                Por: Maria Fernanda
            </p>

            <p>
                O Dean Winchester é um dos personagens principais
                do universo de Supernatural, filho de John Winchester
                e irmão do Sam Winchester.
            </p>
        </div>

    </main>

</body>

</html>
